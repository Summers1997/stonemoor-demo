# PROCESSOR REGISTRY (Phase 8)
#
# Every third party that receives data from this site. A host observed at runtime that is not
# listed here blocks deployment (PROC-UNKNOWN-001) — the fix is to investigate and record it, or
# remove it, never to widen a filter.
#
# THE POINT WORTH REPEATING: an approved provider does not mean every implementation is approved.
# Record what this site is allowed to use the provider for, and what it is not.
# -----------------------------------------------------------------------------------------
